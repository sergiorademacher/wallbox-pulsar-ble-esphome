# =============================================================================
#  Wallbox Pulsar (Plus) house-load reader for ESPHome
#
#  Reads the external power meter wired to the Wallbox Power Boost (e.g. a
#  Carlo Gavazzi EM112) over Bluetooth Low Energy and publishes it to Home
#  Assistant as `House Load Power` (W), plus per-phase voltage/current/energy
#  and charger status. SOLO LECTURA / read-only.
#
#  See ../PROTOCOL.md for the full reverse-engineered BLE protocol.
#
#  QUICK START
#    1. cp secrets.yaml.example secrets.yaml   # then fill in your values
#    2. Set `wallbox_mac` below to your charger's BLE MAC (README -> "Find your MAC")
#    3. esphome run wallbox.yaml
#
#  Place the ESP32 within good BLE range of the charger (aim for RSSI > -75 dBm).
# =============================================================================
substitutions:
  name: "wallbox-ble"
  # >>> EDIT THIS: your Wallbox BLE MAC (uppercase, colon-separated).
  wallbox_mac: "AA:BB:CC:DD:EE:FF"
  # Vendor BLE service / RX-TX characteristic (constant for this firmware family).
  service_uuid: "2456e1b9-26e2-8f83-e744-f34f01e9d701"
  char_uuid:    "2456e1b9-26e2-8f83-e744-f34f01e9d703"
  poll_interval: "15s"

esphome:
  name: ${name}
  friendly_name: Wallbox House Load

esp32:
  board: esp32dev            # ESP32-C3? use: lolin_c3_mini (and add output_power to wifi)
  framework:
    type: esp-idf

logger:
  level: INFO

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # On the ESP32-C3 mini, reduced TX power improves WiFi stability:
  # output_power: 8.5dB

# === BLE =====================================================================
esp32_ble_tracker:

esp32_ble:
  io_capability: none        # Just Works pairing (the vendor service needs encryption)
  # If this ESP is dedicated to the Wallbox (no bluetooth_proxy), save RAM with:
  # max_connections: 1

globals:
  - id: rx_buf               # buffer to reassemble the fragmented notification
    type: std::string
    restore_value: false
  - id: last_ok_ms           # millis() of the last VALID meter read (for the watchdog)
    type: uint32_t
    restore_value: false
    initial_value: '0'

ble_client:
  - mac_address: ${wallbox_mac}
    id: wallbox
    on_connect:
      then:
        - logger.log: "Wallbox connected -> starting encryption (Just Works bonding)"
        - lambda: |-
            id(rx_buf).clear();
            // The vendor service requires an encrypted link. io_capability:none only
            // sets the mode; we must TRIGGER encryption/bonding explicitly, otherwise
            // reads/notifications fail with status=15 (insufficient encryption).
            esp_bd_addr_t bda;
            sscanf("${wallbox_mac}", "%hhx:%hhx:%hhx:%hhx:%hhx:%hhx",
                   &bda[0], &bda[1], &bda[2], &bda[3], &bda[4], &bda[5]);
            esp_ble_set_encryption(bda, ESP_BLE_SEC_ENCRYPT);  // ENCRYPT = no MITM = Just Works
    on_disconnect:
      then:
        - logger.log: "Wallbox disconnected"

# Poll the three read methods in turn (responses are routed by their keys).
script:
  - id: poll_all
    then:
      - if:
          condition:
            lambda: "return id(wallbox).connected();"
          then:
            - ble_client.ble_write:
                id: wallbox
                service_uuid: ${service_uuid}
                characteristic_uuid: ${char_uuid}
                value: !lambda |-
                  std::string j = "{\"met\": \"r_dca\", \"par\": null, \"id\": 1}";
                  std::vector<uint8_t> f = {'E','a','E', (uint8_t)j.size()};
                  for (char c : j) f.push_back((uint8_t)c);
                  uint8_t s = 0; for (uint8_t bb : f) s += bb; f.push_back(s);
                  return f;
            - delay: 2s
            - ble_client.ble_write:
                id: wallbox
                service_uuid: ${service_uuid}
                characteristic_uuid: ${char_uuid}
                value: !lambda |-
                  std::string j = "{\"met\": \"r_dat\", \"par\": null, \"id\": 1}";
                  std::vector<uint8_t> f = {'E','a','E', (uint8_t)j.size()};
                  for (char c : j) f.push_back((uint8_t)c);
                  uint8_t s = 0; for (uint8_t bb : f) s += bb; f.push_back(s);
                  return f;
            - delay: 2s
            - ble_client.ble_write:
                id: wallbox
                service_uuid: ${service_uuid}
                characteristic_uuid: ${char_uuid}
                value: !lambda |-
                  std::string j = "{\"met\": \"r_sta\", \"par\": null, \"id\": 1}";
                  std::vector<uint8_t> f = {'E','a','E', (uint8_t)j.size()};
                  for (char c : j) f.push_back((uint8_t)c);
                  uint8_t s = 0; for (uint8_t bb : f) s += bb; f.push_back(s);
                  return f;

interval:
  - interval: ${poll_interval}
    then:
      - script.execute: poll_all
  # Self-heal watchdog: if the link is supposed to be up but we've had no valid meter
  # data for 2 minutes, bounce the BLE connection (no manual power-cycle needed).
  - interval: 30s
    then:
      - if:
          condition:
            lambda: |-
              return id(wb_link).state && id(last_ok_ms) != 0 &&
                     (millis() - id(last_ok_ms)) > 120000;
          then:
            - logger.log: "Watchdog: no valid meter data for 120 s -> reconnecting BLE"
            - lambda: 'id(wallbox).set_enabled(false);'
            - delay: 5s
            - lambda: 'id(wallbox).set_enabled(true); id(last_ok_ms) = millis();'

# === CONTROLS ================================================================
switch:
  # Turn OFF to release the BLE link so you can connect with the Wallbox mobile
  # app (the charger only accepts ONE BLE central at a time). Turn ON to reconnect.
  - platform: template
    name: "Wallbox link (ESP32)"
    id: wb_link
    icon: "mdi:bluetooth-connect"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: 'id(wallbox).set_enabled(true); id(last_ok_ms) = millis();'   # grace period
    turn_off_action:
      - lambda: 'id(wallbox).set_enabled(false);'

button:
  - platform: restart
    name: "Restart ESP32"
    icon: "mdi:restart"
  - platform: template
    name: "Read now"
    icon: "mdi:refresh"
    on_press:
      - script.execute: poll_all

binary_sensor:
  - platform: template
    name: "Wallbox connected"
    device_class: connectivity
    lambda: "return id(wallbox).connected();"

# === SENSORS =================================================================
sensor:
  # Internal sink: receives the d703 notifications, reassembles the fragmented
  # JSON, routes it by key, and publishes to the real sensors below. Always
  # returns NAN (never publishes its own value -> hidden from HA).
  - platform: ble_client
    type: characteristic
    ble_client_id: wallbox
    id: wb_rx
    internal: true
    service_uuid: ${service_uuid}
    characteristic_uuid: ${char_uuid}
    notify: true
    lambda: |-
      auto &b = id(rx_buf);
      b.append(std::string(x.begin(), x.end()));
      // wait until the full response arrived (it ends with "}}")
      if (b.find("\"r\"") == std::string::npos || b.find("}}") == std::string::npos) {
        if (b.size() > 600) b.clear();
        return NAN;
      }
      auto has = [&](const char *k){ return b.find(k) != std::string::npos; };
      auto num = [&](const char *k) -> float {
        size_t i = b.find(k);
        if (i == std::string::npos) return 0.0f;
        return atof(b.c_str() + i + strlen(k));
      };
      if (has("\"p1\"")) {                          // ---- r_dca: power meter ----
        float v1 = num("\"v1\":");
        if (v1 <= 0) {                              // meter not reporting -> skip (don't publish a bogus 0)
          ESP_LOGW("wb", "meter read invalid (v1=0) -> skipped");
        } else {
          float load = num("\"p1\":") + num("\"p2\":") + num("\"p3\":");
          id(house_load).publish_state(load);
          id(p_l1).publish_state(num("\"p1\":"));
          id(p_l2).publish_state(num("\"p2\":"));
          id(p_l3).publish_state(num("\"p3\":"));
          id(v_l1).publish_state(v1);
          id(v_l2).publish_state(num("\"v2\":"));
          id(v_l3).publish_state(num("\"v3\":"));
          id(c_l1).publish_state(num("\"c1\":") / 10.0f);   // deci-amps -> A
          id(c_l2).publish_state(num("\"c2\":") / 10.0f);
          id(c_l3).publish_state(num("\"c3\":") / 10.0f);
          id(energy_kwh).publish_state(num("\"e\":") / 1000.0f);  // Wh -> kWh
          id(last_ok_ms) = millis();                // watchdog: a good read happened
          ESP_LOGI("wb", "House load = %.0f W", load);
        }
      } else if (has("external_meter_status")) {    // ---- r_sta: status/config ----
        id(charger_status).publish_state(num("\"charger_status\":"));
        id(ext_meter_status).publish_state(num("\"external_meter_status\":"));
        id(lock_status).publish_state(num("\"lock_status\":"));
        id(max_chg_current).publish_state(num("\"max_charging_current\":"));
        id(max_avail_current).publish_state(num("\"max_available_current\":"));
        id(pws_status).publish_state(num("\"power_sharing_status\":"));
        id(phases_conn).publish_state(num("\"phases_connection\":"));
      } else if (has("\"cp\"")) {                    // ---- r_dat: charger state ----
        id(chg_power).publish_state(num("\"cp\":"));
        id(set_current).publish_state(num("\"cur\":"));
        id(chg_l1).publish_state(num("\"L1\":") / 10.0f);
        id(chg_l2).publish_state(num("\"L2\":") / 10.0f);
        id(chg_l3).publish_state(num("\"L3\":") / 10.0f);
        id(st_s).publish_state(num("\"s\":"));
        id(st_st).publish_state(num("\"st\":"));
        id(st_ps).publish_state(num("\"ps\":"));
      }
      b.clear();
      return NAN;

  # --- Power meter (r_dca) ---
  - platform: template
    name: "House Load Power"
    id: house_load
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
  - { platform: template, name: "Power L1",  id: p_l1, unit_of_measurement: "W", device_class: power, state_class: measurement, accuracy_decimals: 0 }
  - { platform: template, name: "Power L2",  id: p_l2, unit_of_measurement: "W", device_class: power, state_class: measurement, accuracy_decimals: 0 }
  - { platform: template, name: "Power L3",  id: p_l3, unit_of_measurement: "W", device_class: power, state_class: measurement, accuracy_decimals: 0 }
  - { platform: template, name: "Voltage L1", id: v_l1, unit_of_measurement: "V", device_class: voltage, state_class: measurement, accuracy_decimals: 0 }
  - { platform: template, name: "Voltage L2", id: v_l2, unit_of_measurement: "V", device_class: voltage, state_class: measurement, accuracy_decimals: 0 }
  - { platform: template, name: "Voltage L3", id: v_l3, unit_of_measurement: "V", device_class: voltage, state_class: measurement, accuracy_decimals: 0 }
  - { platform: template, name: "Current L1", id: c_l1, unit_of_measurement: "A", device_class: current, state_class: measurement, accuracy_decimals: 1 }
  - { platform: template, name: "Current L2", id: c_l2, unit_of_measurement: "A", device_class: current, state_class: measurement, accuracy_decimals: 1 }
  - { platform: template, name: "Current L3", id: c_l3, unit_of_measurement: "A", device_class: current, state_class: measurement, accuracy_decimals: 1 }
  - { platform: template, name: "Energy Total", id: energy_kwh, unit_of_measurement: "kWh", device_class: energy, state_class: total_increasing, accuracy_decimals: 2 }

  # --- Charger state (r_dat) ---
  - { platform: template, name: "Charging Power", id: chg_power, unit_of_measurement: "kW", device_class: power, state_class: measurement, accuracy_decimals: 2 }
  - { platform: template, name: "Set Current", id: set_current, unit_of_measurement: "A", device_class: current, state_class: measurement, accuracy_decimals: 0 }
  - { platform: template, name: "Charge Current L1", id: chg_l1, unit_of_measurement: "A", device_class: current, state_class: measurement, accuracy_decimals: 1 }
  - { platform: template, name: "Charge Current L2", id: chg_l2, unit_of_measurement: "A", device_class: current, state_class: measurement, accuracy_decimals: 1 }
  - { platform: template, name: "Charge Current L3", id: chg_l3, unit_of_measurement: "A", device_class: current, state_class: measurement, accuracy_decimals: 1 }
  - { platform: template, name: "Charger State (s)",  id: st_s,  accuracy_decimals: 0, entity_category: diagnostic }
  - { platform: template, name: "Charger Status (st)", id: st_st, accuracy_decimals: 0, entity_category: diagnostic }
  - { platform: template, name: "Power Sharing (ps)", id: st_ps, accuracy_decimals: 0, entity_category: diagnostic }

  # --- Status / config (r_sta) ---
  - { platform: template, name: "Charger Status", id: charger_status, accuracy_decimals: 0, entity_category: diagnostic }
  - { platform: template, name: "External Meter Status", id: ext_meter_status, accuracy_decimals: 0, entity_category: diagnostic }
  - { platform: template, name: "Lock Status", id: lock_status, accuracy_decimals: 0, entity_category: diagnostic }
  - { platform: template, name: "Max Charging Current", id: max_chg_current, unit_of_measurement: "A", device_class: current, accuracy_decimals: 0, entity_category: diagnostic }
  - { platform: template, name: "Max Available Current", id: max_avail_current, unit_of_measurement: "A", device_class: current, accuracy_decimals: 0, entity_category: diagnostic }
  - { platform: template, name: "Power Sharing Status", id: pws_status, accuracy_decimals: 0, entity_category: diagnostic }
  - { platform: template, name: "Phases Connection", id: phases_conn, accuracy_decimals: 0, entity_category: diagnostic }

  # --- diagnostics ---
  - platform: wifi_signal
    name: "WiFi RSSI"
    update_interval: 60s
    entity_category: diagnostic
  - platform: uptime
    name: "Uptime"
    entity_category: diagnostic

# Firmware build timestamp -- changes on every recompile, so you can confirm a new
# build is actually running (visible in HA and over the native API).
text_sensor:
  - platform: template
    name: "Firmware Build"
    id: fw_build
    icon: "mdi:chip"
    entity_category: diagnostic
    update_interval: 60s
    lambda: 'return {App.get_build_time_string()};'
